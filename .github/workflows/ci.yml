name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Compile check
        run: python -m compileall src tests

      - name: Ruff lint
        run: ruff check src tests

      - name: Mypy type check
        run: mypy src/agentic_runtime

      - name: Lint/type debt ratchet (may only shrink)
        run: python scripts/lint_ratchet.py --check

      - name: Architectural guards (doc registry + governance resolver)
        run: python scripts/governance_guards.py --check

      - name: Host capability report (informative)
        run: python -m agentic_runtime.cli doctor --json || true

      - name: Reverse-deps audit (informative)
        run: python scripts/reverse_deps.py || true

      - name: Enforcement profile drift gate (F1 — config/wiring must match the profile)
        run: |
          python -m agentic_runtime.cli profile show
          python -m agentic_runtime.cli profile audit --profile dev --fail-on-drift
          python -m agentic_runtime.cli profile audit --profile standard --fail-on-drift
          python -m agentic_runtime.cli profile audit --profile hardened --fail-on-drift

      - name: Run tests with coverage
        run: pytest -q --cov=agentic_runtime --cov-report=term-missing --cov-fail-under=75

      - name: Alpha seal verification
        run: python -m agentic_runtime.cli alpha-seal
