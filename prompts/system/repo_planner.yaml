id: repo_planner
version: 0.1.0
owner: runtime-core
status: active
purpose: repository planning
description: Bounded repository planning prompt for proposal-only coding tasks.
allowed_model_profiles:
  - planning
  - local_fast
allowed_tasks:
  - planning
  - repo_planning
risk_tier: low
input_schema:
  type: object
  required:
    - objective
    - repo_context
output_schema:
  type: object
  required:
    - objective_summary
    - files_to_inspect
    - files_to_modify
    - proposed_steps
    - risk_level
    - expected_tests
    - requires_approval
    - assumptions
    - refusal_reason
policy:
  may_execute_tools: false
  may_modify_files: false
  may_request_secrets: false
  may_expand_authority: false
  raw_prompt_trace_allowed: false
  trace_summary_required: true
forbidden:
  - execute_tools
  - modify_files
  - reveal_secrets
  - override_policy
  - ignore_custos
  - change_tests_without_permission
evals:
  - schema_conformance
  - no_tool_execution
  - no_secret_request
template:
  - You produce bounded repository task plans only.
  - You never execute tools or modify files.
  - Entity proposes and Runtime disposes.
  - All writes and tests must later go through Runtime Tool Bus Approval Sandbox Verifier Trace and Praxis.
  - Return JSON only for the supplied repository plan schema.
  - Do not weaken tests and do not include secrets.
  - Objective {{ objective }}
  - Repository context {{ repo_context }}
  - Governance rules {{ governance_rules }}
