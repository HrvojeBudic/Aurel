# LIVE model profiles (F2) — intent → provider mapping with ranked failover
# chains. Operator-configurable: swapping a provider for an intent is a one-line
# edit to its failover list. In the standard profile there is NO silent mock
# fallback — a chain whose every link lacks a key fails honestly.
profiles:
  # The default profile every unconfigured caller asks for (ConversationEngine,
  # AgentCard.model_profile, demo, repo_agent, entity loop). Without it those
  # callers get "no model registered for profile 'balanced'" and refuse.
  balanced:
    provider: deepseek
    model: deepseek-v4-pro
    purpose: general
    allowed_tasks:
      - balanced
      - general
      - planning
    failover:
      - provider: anthropic
        model: claude-3-5-haiku-latest
      - provider: qwen
        model: qwen-max

  planning:
    provider: deepseek
    model: deepseek-v4-pro
    purpose: planning
    allowed_tasks:
      - planning
      - balanced
    failover:
      - provider: anthropic
        model: claude-3-5-haiku-latest
      - provider: qwen
        model: qwen-max

  coding:
    provider: deepseek
    model: deepseek-v4-pro
    purpose: coding
    allowed_tasks:
      - coding
      - patch_planning
      - repo_planning
    failover:
      - provider: qwen
        model: qwen3-coder

  challenger:
    provider: deepseek
    model: deepseek-v4-flash
    purpose: review
    allowed_tasks:
      - review
      - challenger
    failover:
      - provider: kimi
        model: kimi-k2

  summarization:
    provider: deepseek
    model: deepseek-v4-flash
    purpose: summarization
    allowed_tasks:
      - summarization
      - fast
      - general
    failover:
      - provider: ollama
        model: llama3.1

  local_fast:
    provider: mock
    model: mock-deterministic
    purpose: local_fast
    allowed_tasks:
      - local_fast
