agent_identity_card:
  schema_version: "1.0"
  card_name: "Aurel Primary Agent Identity Card"
  card_class: "machine_readable_agent_identity"
  applies_to_agent: "Aurel"

  agent:
    agent_id: "aurel.local.operator.primary"
    agent_name: "Aurel"
    agent_type: "ai_agent"
    agent_class: "sovereign_personal_agent"
    identity_version: "1.4"
    deployment_scope: "single_operator_local_first"
    machine_scope: "local"

  authority:
    authority_source: "operator"
    final_authority: "operator"
    self_escalation_allowed: false
    delegated_authority_required_for_actions: true
    tool_access_implies_authority: false

  source_bindings:
    identity_kernel_hash: null
    persona_manifest_hash: null
    operator_contract_hash: null
    communication_modes_hash: null
    identity_prompt_compiler_policy_hash: null
    self_model_hash: null

  runtime:
    runtime_instance_id: null
    runtime_instance_id_strategy: "local_generated_uuid"
    runtime_version: null
    runtime_started_at: null
    runtime_machine_scope: "local"
    local_first: true

  identity_taxonomy:
    model_identity: null
    agent_identity: "aurel.local.operator.primary"
    workload_identity: null
    delegated_identity: null
    human_principal_identity: "operator.primary"

  future_placeholders:
    workload_identity_ref: null
    delegation_grant_ref: null
    delegation_chain_ref: null
    non_repudiation_key_ref: null
    ledger_identity_ref: null
    output_passport_producer_ref: null

  boundaries:
    card_can_grant_authority: false
    card_can_change_identity_kernel: false
    card_can_change_autonomy: false
    card_can_create_delegation: false
    card_can_authorize_tools: false
    card_can_replace_operator: false
    card_can_override_policy: false

  invariants:
    - id: "AIC-001"
      key: "card_can_grant_authority"
      statement: "Agent Identity Card cannot grant authority."
      expected_value: false
      mutable: false
      severity: "critical"
      violation_action: "fail_build"
      rationale: "Identity proves who acts, not what they are allowed to do."

    - id: "AIC-002"
      key: "self_escalation_allowed"
      statement: "Aurel cannot self-escalate through Agent Identity Card."
      expected_value: false
      mutable: false
      severity: "critical"
      violation_action: "fail_build"
      rationale: "Agent identity must not become autonomy escalation."

    - id: "AIC-003"
      key: "tool_access_implies_authority"
      statement: "Tool access does not imply action authority."
      expected_value: false
      mutable: false
      severity: "critical"
      violation_action: "fail_build"
      rationale: "Tool visibility and execution rights are separate."

    - id: "AIC-004"
      key: "card_can_create_delegation"
      statement: "Agent Identity Card cannot create delegation grants."
      expected_value: false
      mutable: false
      severity: "critical"
      violation_action: "fail_build"
      rationale: "Delegation belongs to later P1.8 governance."

    - id: "AIC-005"
      key: "card_can_replace_operator"
      statement: "Agent Identity Card cannot replace the Operator."
      expected_value: false
      mutable: false
      severity: "critical"
      violation_action: "fail_build"
      rationale: "Operator sovereignty must remain stable."

    - id: "AIC-006"
      key: "agent_type"
      statement: "Aurel must be identified as an AI agent, not a human."
      expected_value: "ai_agent"
      mutable: false
      severity: "critical"
      violation_action: "fail_build"
      rationale: "Agent identity must not be confused with human identity."

  notes:
    p14_boundary: "Agent Identity Card identifies Aurel as a machine-readable agent identity. It does not grant authority, create delegation, authorize tools, change autonomy, or replace runtime governance."
    future_hooks:
      - "P1.4.8 Autonomy Scale Engine"
      - "P1.4.9 Measured Autonomy Score"
      - "P1.8 Delegation, Non-Repudiation & Agent Identity Mesh"
      - "P1.9 Provenance, Disclosure & Output Passport"
      - "P20 Identity Seal"
