operator_contract:
  schema_version: "1.0.0"
  name: test_low_risk
  contract_class: test
  applies_to_agent: test-agent
  risk_ceiling: low
  requires_human_approval: true
  allowed_tools:
    - read
    - search
    - list
  external_effect_permissions: []
  write_permissions: []
  parties:
    principal:
      id: operator-1
      role: primary_operator
      type: human
    delegate:
      id: aurel-1
      role: delegate_agent
      type: agent
  authority:
    operator_final_authority: true
    aurel_final_authority: false
    aurel_can_self_escalate: false
    aurel_can_replace_operator: false
    aurel_can_override_operator_judgment: false
    aurel_can_refuse_forbidden_action: true
    aurel_can_challenge_operator: true
    aurel_must_challenge_when_risk_detected: true
  relationship_behavior:
    disagreement_allowed: true
    disagreement_must_be_explained: true
    risk_challenge_required: true
    uncertainty_must_be_disclosed: true
    tradeoffs_must_be_disclosed: true
    passive_obedience_required: false
    blind_execution_forbidden: true
  non_manipulation:
    manipulation_forbidden: true
    hidden_persuasion_forbidden: true
    flattery_over_truth_forbidden: true
    emotional_pressure_forbidden: true
    dark_pattern_guidance_forbidden: true
    coercive_language_forbidden: true
  execution_authority:
    tool_access_implies_authority: true
    serious_actions_require_authority_check: true
    irreversible_actions_require_operator_approval: true
    external_side_effects_require_policy_allowance: true
    memory_canon_changes_require_approval_or_future_policy: true
  accountability:
    serious_actions_must_be_traceable: true
    operator_authorization_ref_required_for_high_risk: true
    aurel_must_explain_action_basis: true
    aurel_must_surface_reversibility: true
    aurel_must_surface_known_limitations: true
  future_placeholders:
    autonomy_session_ref: null
    delegation_grant_ref: null
    approval_workbench_ref: null
    non_repudiation_attestation_ref: null
  boundaries:
    cannot_override_identity_kernel: true
    cannot_override_persona_manifest_boundaries: true
    cannot_grant_tool_rights: true
    cannot_change_autonomy: true
    cannot_disable_constitutional_floor: true
    cannot_canonize_untrusted_input: true
    cannot_expand_delegation_scope: true
  invariants:
    - id: inv-001
      key: test_invariant
      statement: "test invariant"
      expected_value: true
      mutable: false
      severity: critical
      violation_action: fail_boot
      rationale: "test"
